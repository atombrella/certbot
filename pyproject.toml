[tool.coverage.run]
branch = true
relative_files = true
source = ["acme/acme","certbot*/certbot*"]

[tool.coverage.report]
exclude_also = [
    "assert False",
]
show_missing = true

# [lint.flake8-tidy-imports.banned-api]
# banned-modules =
#   mock = "Use unittest.mock."
#   os = "Use certbot.compat.os instead"

[tool.ruff]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # Warning
    "W",
    # pyupgrade
    # "UP",
    # Tidy Imports
    "TID",
]
line-length = 119
exclude = ["tools", "letstest", "linter_plugin.py", "certbot/docs/conf.py"]
# Remove if/when we move setup.py python-requires metadata to pyproject.toml
target-version = "py39"
