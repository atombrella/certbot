[tool.coverage.run]
branch = true
relative_files = true
source = ["acme/acme", "certbot*/certbot*"]

[tool.ruff]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # Warning
    "W",
    # pyupgrade
    # "UP",
    # Isort
    # "I",
]
# TID251 = tidy imports used for replacing the os-forbidden-import pylint custom rule
extend-select = ["TID251"]
line-length = 119

exclude = ["tools", "letstest", "certbot/docs/conf.py"]
# Remove if/when we move setup.py python-requires metadata to pyproject.toml
target-version = "py39"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os".msg = "Forbidden use of os module, certbot.compat.os must be used instead"

[tool.ruff.lint.per-file-ignores]
"acme/acme/*" = ["TID251"]
"certbot-ci/*" = ["TID251"]
"certbot-compatibility-test/*" = ["TID251"]
"modification-check.py" = ["TID251"]
"setup.py" = ["TID251"]
"*/_internal/tests/*" = ["TID251"]
"*/docs/conf.py" = ["TID251"]
